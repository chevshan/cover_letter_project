name: Deploy on push to master

on:
  push:
    branches:
      - master

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose services
        run: |
          docker compose up --build -d

      - name: Check frontend is responding
        run: timeout 30 sh -c 'until curl -s http://localhost:8501/; do sleep 2; done'
        
      - name: Check backend is responding
        run: timeout 30 sh -c 'until curl -s http://localhost:8000/health; do sleep 2; done'

      - name: Shutdown services after test
        if: always()
        run: |
          docker compose down --remove-orphans
